<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yuchen Zhong — Mobile Preview</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,Arial,sans-serif;background:#111}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 20%,#292929 0,#151515 42%,#090909 100%)}
    .stage{position:relative;width:390px;height:844px;transform-origin:center;border:1px solid #454545;border-radius:34px;overflow:hidden;background:#000;box-shadow:0 34px 100px #000b,0 0 0 8px #050505}
    iframe{display:block;width:390px;height:844px;border:0;background:#000}
    .label{position:fixed;top:18px;left:22px;font-size:10px;letter-spacing:.16em;color:#aaa;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="label">Mobile preview · 390 × 844</div>
  <div class="stage"><iframe src="./" title="Yuchen Zhong mobile portfolio preview"></iframe></div>
  <script>
    const stage=document.querySelector('.stage');
    const fit=()=>stage.style.transform=`scale(${Math.min(1,(innerWidth-44)/390,(innerHeight-78)/844)})`;
    addEventListener('resize',fit,{passive:true});fit();
  </script>
</body>
</html>
